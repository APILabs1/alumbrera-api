services:
  db:
      image: postgres:16-alpine
      container_name: alumbrera-db
      environment:
        POSTGRES_USER: alumbrera
        POSTGRES_PASSWORD: localdev
        POSTGRES_DB: alumbrera
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U alumbrera"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  pgdata:
