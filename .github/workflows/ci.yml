name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alumbrera
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: alumbrera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alumbrera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: alumbrera
      DB_PASSWORD: localdev
      DB_NAME: alumbrera
      DB_SSL: 'false'
      DATABASE_URL: postgresql://alumbrera:localdev@localhost:5432/alumbrera
      AZURE_JWKS_URI: https://example.com/keys
      AZURE_ISSUER: https://example.com/
      AZURE_AUDIENCE: 00000000-0000-0000-0000-000000000000
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Unit tests
        run: pnpm run test --coverage

      - name: E2E tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alumbrera
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: alumbrera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alumbrera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t alumbrera-api:${{ github.sha }} .

      - name: Smoke test the image
        run: |
          docker run -d --name api-smoke --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=alumbrera \
            -e DB_PASSWORD=localdev \
            -e DB_NAME=alumbrera \
            -e DB_SSL=false \
            -e DATABASE_URL=postgresql://alumbrera:localdev@localhost:5432/alumbrera \
            -e AZURE_JWKS_URI=https://example.com/keys \
            -e AZURE_ISSUER=https://example.com/ \
            -e AZURE_AUDIENCE=00000000-0000-0000-0000-000000000000 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            alumbrera-api:${{ github.sha }}
          sleep 15
          docker logs api-smoke
          docker logs api-smoke | grep -q "API listening" || (docker rm -f api-smoke; exit 1)
          docker rm -f api-smoke
